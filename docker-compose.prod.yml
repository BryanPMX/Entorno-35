version: '3.8'

services:
  # --- Your Go Backend ---
  api:
    image: ${DOCKERHUB_USERNAME:-brpmx}/entorno35-backend:develop
    restart: always
    ports:
      - "8080:8080" # Maps port 8080 inside to 8080 on the server
    depends_on:
      - db
      - redis
    environment:
      # App Settings
      - ENV=production
      - PORT=8080
      - API_VERSION=v1
      
      # Database Config (Notice DB_HOST is "db", not localhost!)
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-entorno35}
      - DB_SSLMODE=disable
      
      # Redis Config (Notice REDIS_HOST is "redis")
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      
      # Security & CORS
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=24h
      # Important: Use single origin (backend only supports one)
      - CORS_ORIGIN=${CORS_ORIGIN:-https://entorno35.com}
      
      # Email (Fill these in if you have them, otherwise leave as is)
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # --- PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-entorno35}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# --- Persistent Storage (So data survives restarts) ---
volumes:
  postgres_data:
  redis_data:
