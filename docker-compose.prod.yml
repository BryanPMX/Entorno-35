version: '3.8'

services:
  # --- Your Go Backend ---
  api:
    image: ${DOCKERHUB_USERNAME:-brpmx}/entorno35-backend:${IMAGE_TAG:-develop}
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      # App Settings
      - ENV=production
      - PORT=8080
      - API_VERSION=v1
      
      # Database Config (DB_HOST = service name "postgres")
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-entorno35}
      - DB_SSLMODE=disable
      
      # Redis Config (Notice REDIS_HOST is "redis")
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      
      # Security & CORS
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=24h
      # Must match the frontend origin (e.g. https://www.entorno35.com)
      - CORS_ORIGIN=${CORS_ORIGIN:-https://www.entorno35.com}

      # Stripe Billing
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_MONTHLY=${STRIPE_PRICE_MONTHLY}
      - STRIPE_PRICE_YEARLY=${STRIPE_PRICE_YEARLY}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL}
      - STRIPE_PORTAL_RETURN_URL=${STRIPE_PORTAL_RETURN_URL}
      - BILLING_ADMIN_EMAIL=${BILLING_ADMIN_EMAIL}
      - BILLING_ADMIN_PASSWORD_HASH=${BILLING_ADMIN_PASSWORD_HASH}
      - PENDING_REGISTRATION_CLEANUP_ENABLED=${PENDING_REGISTRATION_CLEANUP_ENABLED:-true}
      - PENDING_REGISTRATION_CLEANUP_INTERVAL=${PENDING_REGISTRATION_CLEANUP_INTERVAL:-1h}
      - PENDING_REGISTRATION_CLEANUP_RETENTION=${PENDING_REGISTRATION_CLEANUP_RETENTION:-168h}
      - CHECKOUT_RATE_LIMIT_ENABLED=${CHECKOUT_RATE_LIMIT_ENABLED:-true}
      - CHECKOUT_RATE_LIMIT_LIMIT=${CHECKOUT_RATE_LIMIT_LIMIT:-10}
      - CHECKOUT_RATE_LIMIT_WINDOW=${CHECKOUT_RATE_LIMIT_WINDOW:-15m}
      
      # Email (Fill these in if you have them, otherwise leave as is)
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # --- PostgreSQL Database ---
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-entorno35}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# --- Persistent Storage (So data survives restarts) ---
volumes:
  postgres_data:
  redis_data:
