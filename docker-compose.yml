version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: entorno35-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-entorno35}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-entorno35}
      POSTGRES_DB: ${POSTGRES_DB:-entorno35}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-entorno35}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: entorno35-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

